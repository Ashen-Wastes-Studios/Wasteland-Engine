version: "3.9"
services:
  searxng:
    image: searxng/searxng:latest
    ports: ["8888:8080"]
  meilisearch:
    image: getmeili/meilisearch:v1.7
    ports: ["7700:7700"]
    environment:
      - MEILI_MASTER_KEY=masterKey
  ollama:
    image: ollama/ollama:latest
    ports: ["11434:11434"]
    volumes: ["ollama:/root/.ollama"]
volumes:
  ollama:
